name: 定时触发器

# 这个workflow的目的是解决GitHub Actions scheduled延迟问题
# 它每10分钟运行一次（GitHub最短间隔），检查当前时间，
# 如果是交易时间则触发推荐/复盘workflow

on:
  schedule:
    - cron: '*/10 * * * 1-5'  # 工作日每10分钟
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Check time and trigger
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 获取北京时间
          BJ_HOUR=$(TZ=Asia/Shanghai date +%H)
          BJ_MIN=$(TZ=Asia/Shanghai date +%M)
          BJ_DOW=$(TZ=Asia/Shanghai date +%u)
          BJ_MINUTES=$((10#$BJ_HOUR * 60 + 10#$BJ_MIN))
          
          echo "北京时间: ${BJ_HOUR}:${BJ_MIN} (星期${BJ_DOW})"
          
          # 仅在工作日执行
          if [ "$BJ_DOW" -gt 5 ]; then
            echo "非交易日，跳过"
            exit 0
          fi
          
          # 检查是否需要触发推荐 (14:25-14:35之间)
          if [ "$BJ_MINUTES" -ge 865 ] && [ "$BJ_MINUTES" -le 875 ]; then
            echo "触发推荐..."
            # 检查今天是否已触发过推荐
            RUNS=$(gh run list --repo ${{ github.repository }} --workflow=stock.yml --limit 5 --json event,createdAt --jq '.[] | select(.createdAt | startswith("'$(date -u +%Y-%m-%d)'")) | select(.event == "repository_dispatch" or .event == "schedule") | .event' 2>/dev/null || echo "")
            
            # 通过repository_dispatch触发
            curl -s -X POST \
              -H "Authorization: token ${{ secrets.GH_PAT }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/dispatches" \
              -d '{"event_type":"recommend"}'
            echo "推荐已触发"
          fi
          
          # 检查是否需要触发复盘 (09:35-09:45之间)
          if [ "$BJ_MINUTES" -ge 575 ] && [ "$BJ_MINUTES" -le 585 ]; then
            echo "触发复盘..."
            curl -s -X POST \
              -H "Authorization: token ${{ secrets.GH_PAT }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/dispatches" \
              -d '{"event_type":"review"}'
            echo "复盘已触发"
          fi
          
          echo "检查完成"
