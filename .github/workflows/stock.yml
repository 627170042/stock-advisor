name: A股T+1选股系统

on:
  repository_dispatch:
    types: [recommend, review, check]
  workflow_dispatch:
    inputs:
      task:
        description: 'recommend / review / check'
        required: true
        default: 'check'

jobs:
  recommend:
    if: >
      github.event_name == 'repository_dispatch' && github.event.action == 'recommend'
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'recommend')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Restore data
        run: |
          git fetch origin data 2>/dev/null || true
          if git branch -r | grep -q "origin/data"; then
            git checkout origin/data -- data/ 2>/dev/null || true
          else
            mkdir -p data/history data/reports data/config
          fi
      - name: Run recommendation
        env:
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          DATA_DIR: ./data
        run: python main.py
      - name: Save data
        run: |
          git config user.name "Stock Bot"
          git config user.email "627170042@qq.com"
          git add data/ 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "recommend $(date +%Y-%m-%d)"
            git push origin HEAD:data --force
            echo "Data saved"
          else
            echo "No data changes"
          fi

  review:
    if: >
      github.event_name == 'repository_dispatch' && github.event.action == 'review'
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'review')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Restore data
        run: |
          git fetch origin data 2>/dev/null || true
          if git branch -r | grep -q "origin/data"; then
            git checkout origin/data -- data/ 2>/dev/null || true
          else
            mkdir -p data/history data/reports data/config
          fi
      - name: Run review
        env:
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          DATA_DIR: ./data
        run: python review.py
      - name: Save data
        run: |
          git config user.name "Stock Bot"
          git config user.email "627170042@qq.com"
          git add data/ 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "review $(date +%Y-%m-%d)"
            git push origin HEAD:data --force
            echo "Data saved"
          else
            echo "No data changes"
          fi

  check:
    if: >
      github.event_name == 'repository_dispatch' && github.event.action == 'check'
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'check')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check and trigger
        env:
          DATA_DIR: ./data
        run: |
          git fetch origin data 2>/dev/null || true
          if git branch -r | grep -q "origin/data"; then
            git checkout origin/data -- data/ 2>/dev/null || true
          else
            mkdir -p data/history data/reports data/config
          fi
          
          python -c "
          import json, os, requests
          from datetime import datetime, timedelta
          
          now = datetime.utcnow() + timedelta(hours=8)
          today = now.strftime('%Y-%m-%d')
          minutes = now.hour * 60 + now.minute
          
          # 检查推荐
          if minutes >= 865:
              try:
                  with open('data/reports/latest.json') as f:
                      d = json.load(f)
                  if d.get('date') != today:
                      print('需要推荐')
                      os.system('curl -s -X POST -H \"Authorization: token $GH_PAT\" -H \"Accept: application/vnd.github.v3+json\" https://api.github.com/repos/${{ github.repository }}/dispatches -d \\'{\"event_type\":\"recommend\"}\\'')
              except:
                  print('需要推荐(无数据)')
                  os.system('curl -s -X POST -H \"Authorization: token $GH_PAT\" -H \"Accept: application/vnd.github.v3+json\" https://api.github.com/repos/${{ github.repository }}/dispatches -d \\'{\"event_type\":\"recommend\"}\\'')
          
          # 检查复盘
          if minutes >= 575:
              try:
                  with open('data/history/recommendations.json') as f:
                      data = json.load(f)
                  pending = [r for r in data if r.get('result') is None and r['date'] < today]
                  if len(pending) > 0:
                      print(f'需要复盘({len(pending)}条)')
                      os.system('curl -s -X POST -H \"Authorization: token $GH_PAT\" -H \"Accept: application/vnd.github.v3+json\" https://api.github.com/repos/${{ github.repository }}/dispatches -d \\'{\"event_type\":\"review\"}\\'')
              except:
                  pass
          "
