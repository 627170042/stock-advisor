name: A股T+1选股系统

on:
  repository_dispatch:
    types: [recommend, review, check]
  workflow_dispatch:
    inputs:
      task:
        description: 'recommend / review / check'
        required: true
        default: 'check'

jobs:
  # 交易日检查 - 所有任务的前置条件
  trading-day-check:
    runs-on: ubuntu-latest
    outputs:
      is_trading_day: ${{ steps.check.outputs.is_trading_day }}
    steps:
      - id: check
        run: |
          BJ_DOW=$(TZ=Asia/Shanghai date +%u)
          TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          
          # 周末直接跳过
          if [ "$BJ_DOW" -gt 5 ]; then
            echo "is_trading_day=false" >> $GITHUB_OUTPUT
            echo "周末，非交易日"
            exit 0
          fi
          
          # 节假日检查（从data分支读取）
          git clone --depth=1 -b data https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git /tmp/data 2>/dev/null || true
          if [ -f /tmp/data/data/config/holidays.json ]; then
            YEAR=$(echo $TODAY | cut -c1-4)
            HOLIDAYS=$(python3 -c "import json; d=json.load(open('/tmp/data/data/config/holidays.json')); print(' '.join(d.get('$YEAR',[])))")
            for h in $HOLIDAYS; do
              if [ "$h" = "$TODAY" ]; then
                echo "is_trading_day=false" >> $GITHUB_OUTPUT
                echo "节假日($TODAY)，非交易日"
                exit 0
              fi
            done
          fi
          
          echo "is_trading_day=true" >> $GITHUB_OUTPUT
          echo "交易日确认"

  recommend:
    needs: trading-day-check
    if: >-
      needs.trading-day-check.outputs.is_trading_day == 'true' && 
      (github.event.action == 'recommend' || (github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'recommend'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pre-flight test
        run: python test_suite.py
        continue-on-error: true
      - name: Restore data
        run: |
          git fetch origin data 2>/dev/null || true
          if git branch -r | grep -q "origin/data"; then
            git checkout origin/data -- data/ 2>/dev/null || true
          else
            mkdir -p data/history data/reports data/config
          fi
      - name: Run recommendation
        env:
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          DATA_DIR: ./data
        run: python main.py
      - name: Save data
        run: |
          git config user.name "Stock Bot"
          git config user.email "627170042@qq.com"
          git add data/ 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "recommend $(date +%Y-%m-%d)"
            git push origin HEAD:data --force
            echo "Data saved"
          else
            echo "No data changes"
          fi

  review:
    needs: trading-day-check
    if: >-
      needs.trading-day-check.outputs.is_trading_day == 'true' && 
      (github.event.action == 'review' || (github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'review'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pre-flight test
        run: python test_suite.py
        continue-on-error: true
      - name: Restore data
        run: |
          git fetch origin data 2>/dev/null || true
          if git branch -r | grep -q "origin/data"; then
            git checkout origin/data -- data/ 2>/dev/null || true
          else
            mkdir -p data/history data/reports data/config
          fi
      - name: Run review
        env:
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          DATA_DIR: ./data
        run: python review.py
      - name: Save data
        run: |
          git config user.name "Stock Bot"
          git config user.email "627170042@qq.com"
          git add data/ 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "review $(date +%Y-%m-%d)"
            git push origin HEAD:data --force
            echo "Data saved"
          else
            echo "No data changes"
          fi
