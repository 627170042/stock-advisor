name: A股T+1选股系统

on:
  schedule:
    # GitHub scheduled可能有延迟，但作为备用
    - cron: '20 6 * * 1-5'   # 推荐 ~14:20北京
    - cron: '30 1 * * 1-5'   # 复盘 ~09:30北京
  workflow_dispatch:
    inputs:
      task:
        description: 'recommend 或 review'
        required: true
        default: 'recommend'
  repository_dispatch:
    types: [recommend, review]

jobs:
  # 主推荐任务
  recommend:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '20 6 * * 1-5')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'recommend')
      || (github.event_name == 'repository_dispatch' && github.event.action == 'recommend')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Restore data
        run: |
          git fetch origin data 2>/dev/null || true
          if git branch -r | grep -q "origin/data"; then
            git checkout origin/data -- data/ 2>/dev/null || true
          else
            mkdir -p data/history data/reports data/config
          fi
      
      - name: Run recommendation
        env:
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          DATA_DIR: ./data
        run: python main.py
      
      - name: Save data
        run: |
          git config user.name "Stock Bot"
          git config user.email "627170042@qq.com"
          git add data/ 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "Update stock data - $(date +%Y-%m-%d)"
            git push origin HEAD:data 2>/dev/null || true
          fi

  # 复盘任务
  review:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '30 1 * * 1-5')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'review')
      || (github.event_name == 'repository_dispatch' && github.event.action == 'review')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Restore data
        run: |
          git fetch origin data 2>/dev/null || true
          if git branch -r | grep -q "origin/data"; then
            git checkout origin/data -- data/ 2>/dev/null || true
          else
            mkdir -p data/history data/reports data/config
          fi
      
      - name: Run review
        env:
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          DATA_DIR: ./data
        run: python review.py
      
      - name: Save data
        run: |
          git config user.name "Stock Bot"
          git config user.email "627170042@qq.com"
          git add data/ 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "Update review data - $(date +%Y-%m-%d)"
            git push origin HEAD:data 2>/dev/null || true
          fi
