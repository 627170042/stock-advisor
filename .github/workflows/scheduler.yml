name: 守护调度器

# 这个workflow在交易时间段内持续运行，每分钟检查时间，精确定时触发推荐/复盘
# 解决GitHub Actions scheduled延迟不可控的问题

on:
  schedule:
    - cron: '0 6 * * 1-5'    # 14:00北京开始
    - cron: '0 1 * * 1-5'    # 09:00北京开始
  workflow_dispatch:

jobs:
  scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # 最多运行90分钟
    permissions:
      actions: write
    steps:
      - name: Schedule and trigger
        run: |
          echo "守护调度器启动"
          
          # 循环检查时间，精确触发
          for i in $(seq 1 90); do
            BJ_HOUR=$(TZ=Asia/Shanghai date +%H)
            BJ_MIN=$(TZ=Asia/Shanghai date +%M)
            BJ_MINUTES=$((10#$BJ_HOUR * 60 + 10#$BJ_MIN))
            BJ_TIME="${BJ_HOUR}:${BJ_MIN}"
            
            echo "[${BJ_TIME}] 检查..."
            
            # 推荐: 14:25
            if [ "$BJ_MINUTES" -eq 865 ]; then
              echo "⏰ 14:25 触发推荐!"
              curl -s -X POST \
                -H "Authorization: token ${{ secrets.GH_PAT }}" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/${{ github.repository }}/dispatches" \
                -d '{"event_type":"recommend"}'
              echo "推荐已触发"
            fi
            
            # 复盘: 09:35
            if [ "$BJ_MINUTES" -eq 575 ]; then
              echo "⏰ 09:35 触发复盘!"
              curl -s -X POST \
                -H "Authorization: token ${{ secrets.GH_PAT }}" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/${{ github.repository }}/dispatches" \
                -d '{"event_type":"review"}'
              echo "复盘已触发"
            fi
            
            # 如果已经过了15:00或10:00，可以退出
            if [ "$BJ_MINUTES" -gt 900 ] || ([ "$BJ_HOUR" -ge 10 ] && [ "$BJ_MINUTES" -lt 860 ]); then
              echo "交易时间已过，退出"
              break
            fi
            
            sleep 60
          done
          
          echo "守护调度器结束"
