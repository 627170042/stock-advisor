name: 每日调度

# 在UTC 00:00(北京08:00)触发，然后在脚本内精确等待到目标时间
# UTC 00:00是GitHub最不忙的时间，scheduled延迟最小

on:
  schedule:
    - cron: '55 23 * * 1-5'   # UTC 23:55 = 北京07:55，提前启动等复盘
    - cron: '25 5 * * 1-5'    # UTC 05:25 = 北京13:25，提前启动等推荐
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: write
    steps:
      - name: Wait and trigger
        run: |
          BJ_HOUR=$(TZ=Asia/Shanghai date +%H)
          BJ_MIN=$(TZ=Asia/Shanghai date +%M)
          BJ_DOW=$(TZ=Asia/Shanghai date +%u)
          BJ_MINUTES=$((10#$BJ_HOUR * 60 + 10#$BJ_MIN))
          
          echo "启动时间 北京${BJ_HOUR}:${BJ_MIN} 星期${BJ_DOW}"
          
          if [ "$BJ_DOW" -gt 5 ]; then
            echo "非交易日，退出"
            exit 0
          fi
          
          # 确定要触发的任务和等待时间
          # 复盘目标09:35=575分钟
          # 推荐目标14:25=865分钟
          
          TRIGGERED=""
          
          # 如果还没到09:35，等复盘
          if [ "$BJ_MINUTES" -lt 575 ]; then
            WAIT=$(( (575 - BJ_MINUTES) * 60 ))
            echo "等待${WAIT}秒到09:35触发复盘..."
            sleep $WAIT
            curl -s -X POST \
              -H "Authorization: token ${{ secrets.GH_PAT }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/dispatches" \
              -d '{"event_type":"review"}'
            echo "✅ 复盘已触发 (北京09:35)"
            TRIGGERED="review"
          fi
          
          # 如果还没到14:25，等推荐
          if [ "$BJ_MINUTES" -lt 865 ]; then
            # 重新计算当前时间
            BJ_MINUTES_NOW=$(TZ=Asia/Shanghai date +%H)
            BJ_MINUTES_NOW_M=$(TZ=Asia/Shanghai date +%M)
            CURRENT=$((10#$BJ_MINUTES_NOW * 60 + 10#$BJ_MINUTES_NOW_M))
            WAIT=$(( (865 - CURRENT) * 60 ))
            
            if [ "$WAIT" -gt 0 ] && [ "$WAIT" -lt 14400 ]; then  # 最多等4小时
              echo "等待${WAIT}秒到14:25触发推荐..."
              sleep $WAIT
              curl -s -X POST \
                -H "Authorization: token ${{ secrets.GH_PAT }}" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/${{ github.repository }}/dispatches" \
                -d '{"event_type":"recommend"}'
              echo "✅ 推荐已触发 (北京14:25)"
              TRIGGERED="$TRIGGERED recommend"
            fi
          fi
          
          # 如果已过14:25但没触发，立刻触发推荐
          if [ "$BJ_MINUTES" -ge 865 ] && [ -z "$TRIGGERED" ]; then
            curl -s -X POST \
              -H "Authorization: token ${{ secrets.GH_PAT }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/dispatches" \
              -d '{"event_type":"recommend"}'
            echo "✅ 推荐已触发(补)"
          fi
          
          # 如果已过09:35但没触发复盘，立刻触发复盘
          if [ "$BJ_MINUTES" -ge 575 ] && [[ "$TRIGGERED" != *"review"* ]]; then
            curl -s -X POST \
              -H "Authorization: token ${{ secrets.GH_PAT }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/dispatches" \
              -d '{"event_type":"review"}'
            echo "✅ 复盘已触发(补)"
          fi
          
          echo "调度完成: $TRIGGERED"
